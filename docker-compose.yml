# ─────────────────────────────────────────────────────────────
# GROUNDR — Docker Compose
#
# This file starts two services locally:
#   1. PostgreSQL  — our main database (with PostGIS for maps)
#   2. Redis       — for caching and background jobs
#   3. pgAdmin     — a visual tool to browse the database
#
# To start everything:  docker-compose up -d
# To stop everything:   docker-compose down
# To see logs:          docker-compose logs -f
# ─────────────────────────────────────────────────────────────

version: "3.9"

services:

  # ── PostgreSQL + PostGIS ───────────────────────────────────
  # PostGIS adds map/location features to standard PostgreSQL
  # This lets us do "find all properties within 2km" queries
  postgres:
    image: postgis/postgis:15-3.3
    container_name: groundr_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: groundr
      POSTGRES_PASSWORD: groundr123
      POSTGRES_DB: groundr
    ports:
      - "5432:5432"       # exposed on localhost:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data   # data survives restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U groundr -d groundr"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── Redis ──────────────────────────────────────────────────
  # Used for:
  #   - Caching API responses (so we don't hit the DB every time)
  #   - Background job queue (midnight scraping jobs)
  #   - Storing temporary tokens
  redis:
    image: redis:7-alpine
    container_name: groundr_redis
    restart: unless-stopped
    ports:
      - "6379:6379"       # exposed on localhost:6379
    volumes:
      - redis_data:/data  # data survives restarts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  # ── pgAdmin ────────────────────────────────────────────────
  # A visual interface to browse and query your database
  # Open http://localhost:5050 in your browser
  # Login: admin@groundr.com / admin123
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: groundr_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@groundr.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"         # open http://localhost:5050
    depends_on:
      - postgres


# ── Named volumes ──────────────────────────────────────────
# These keep your data safe even when containers restart
volumes:
  postgres_data:
  redis_data: